[mypy]
python_version = 3.11
files = mcp/graph.py,mcp/maintenance.py,mcp/usage.py,mcp/schemas.py,mcp/capability_gate.py,mcp/tool_registry.py,utilities/check_tool_docs.py
ignore_missing_imports = True
check_untyped_defs = True
warn_unused_ignores = True
pretty = True

# Windows-only stdlib used in conditional branches of capability_gate.py.
# mypy on Linux can't resolve it; the runtime guards by os.name == "nt".
[mypy-msvcrt]
ignore_missing_imports = True

# PyYAML ships no type hints, and mypy reports packages with a known stub
# package (types-PyYAML) even under the global ignore_missing_imports.
[mypy-yaml]
ignore_missing_imports = True
